# بصمات المفاتيح — للتعرّف على المزوّد من شكل المفتاح عند لصقه وحده.
# البصمات الغامضة (sk-) لا تُدرج لأنها مشتركة بين عدة مزودات.
keyPatterns:
  - prefix: gsk_
    provider: groq
  - prefix: sk-or-v1-
    provider: openrouter
  - prefix: sk-or-
    provider: openrouter
  - prefix: AIza
    provider: google-ai
  - prefix: xai-
    provider: xai
  - prefix: pplx-
    provider: perplexity
  - prefix: sk-proj-
    provider: openai
  - prefix: nvapi-
    provider: nvidia-nim
  - prefix: hf_
    provider: siliconflow
  - prefix: apx_
    provider: apmix
  - prefix: sk-xt-
    provider: xkiro
  - prefix: sk_
    provider: inceptionlabs
  - prefix: sk-cW7
    provider: bluesminds
  - prefix: cpk_
    provider: chutes
  - prefix: fn_
    provider: fireworks
  - prefix: sk-ant-
    provider: null
