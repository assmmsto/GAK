# كتالوج المزودات — مصدر واحد للحقيقة.
# لإضافة مصدر جديد: أضف كتلة هنا، وسيظهر تلقائياً في نافذة الإضافة وفي الاستيراد الجماعي.
# لا تُخزَّن أي مفاتيح هنا — المفاتيح في قاعدة البيانات أو .env فقط.
#
# tier: 1 = أعلى أولوية (مدفوع/أفضل جودة) → 4 = شبكة أمان مجانية
# free: true تعني أن الحصة المجانية معتبرة

providers:
  - id: openai
    name: OpenAI
    baseUrl: https://api.openai.com/v1
    apiKeyEnv: OPENAI_API_KEY
    tier: 1
    free: false
    signupUrl: https://platform.openai.com/api-keys
  - id: xai
    name: xAI (Grok)
    baseUrl: https://api.x.ai/v1
    apiKeyEnv: XAI_API_KEY
    tier: 1
    free: false
    signupUrl: https://console.x.ai
  - id: ollama
    name: Ollama (Local)
    baseUrl: http://localhost:11434/v1
    apiKeyEnv: null
    tier: 1
    free: true
    signupUrl: https://ollama.com/download
  - id: perplexity
    name: Perplexity
    baseUrl: https://api.perplexity.ai
    apiKeyEnv: PERPLEXITY_API_KEY
    tier: 2
    free: false
    signupUrl: https://www.perplexity.ai/settings/api
  - id: openrouter
    name: OpenRouter
    baseUrl: https://openrouter.ai/api/v1
