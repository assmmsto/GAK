# المزوّدات المُفعَّلة — هذا الملف هو الحالة الوحيدة، ولا يحمل أي مفتاح.
#
# المستودع يُشحن **فارغاً عمداً**: لا مزوّدين، ولا مفاتيح، ولا بيانات تشغيل.
# أضف مزوّداً من الواجهة (المزوّدون ← إضافة) أو من الكتالوج `server/catalog.yaml`
# (38 إعداداً جاهزاً)، وسيُكتب هنا تلقائياً.
#
# المفاتيح نفسها لا تُكتب هنا أبداً — مكانها `data/gateway.db` مشفّرة.
providers: []

routing:
  maxRetries: 3
  timeoutMs: 180000
  maxConcurrent: 20
